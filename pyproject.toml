[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-personal-memory"
version = "0.8.0rc8"
description = "Evidence-linked personal memory service and Hermes provider adapter"
requires-python = ">=3.11"
dependencies = ["hindsight-api-slim[embedded-db,local-onnx]==0.9.2", "hindsight-embed==0.9.2"]

[project.optional-dependencies]
setup = ["PyYAML>=6"]
production = ["PyYAML>=6", "uvicorn>=0.35,<1", "cryptography>=45", "jsonschema>=4.23,<5"]
semantic = ["fastembed==0.8.0"]
http-embeddings = ["numpy>=1.26"]
ann = ["hnswlib==0.8.0"]

[project.scripts]
personal-memory = "personal_memory.__main__:main"

[tool.setuptools.packages.find]
include = ["personal_memory*"]

[tool.setuptools.package-data]
personal_memory = ["host_contract.json"]
